<!doctype html>
<html lang="fr"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin:0; padding:20px; background:var(--paper); font-family:var(--font-ui); }
  .row { display:flex; align-items:flex-end; gap:12px; }
  .step { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .box { background: var(--ink); border-radius: var(--r-2); }
  .lbl { font-family:var(--font-mono); font-size:10px; color:var(--ink-3); }
</style></head>
<body>
<div class="row">
  <div class="step"><div class="box" style="width:2px;height:24px"></div><div class="lbl">s-1<br/>2</div></div>
  <div class="step"><div class="box" style="width:4px;height:24px"></div><div class="lbl">s-2<br/>4</div></div>
  <div class="step"><div class="box" style="width:8px;height:24px"></div><div class="lbl">s-3<br/>8</div></div>
  <div class="step"><div class="box" style="width:12px;height:24px"></div><div class="lbl">s-4<br/>12</div></div>
  <div class="step"><div class="box" style="width:16px;height:24px"></div><div class="lbl">s-5<br/>16</div></div>
  <div class="step"><div class="box" style="width:20px;height:24px"></div><div class="lbl">s-6<br/>20</div></div>
  <div class="step"><div class="box" style="width:24px;height:24px"></div><div class="lbl">s-7<br/>24</div></div>
  <div class="step"><div class="box" style="width:32px;height:24px"></div><div class="lbl">s-8<br/>32</div></div>
  <div class="step"><div class="box" style="width:40px;height:24px"></div><div class="lbl">s-9<br/>40</div></div>
  <div class="step"><div class="box" style="width:48px;height:24px"></div><div class="lbl">s-10<br/>48</div></div>
  <div class="step"><div class="box" style="width:64px;height:24px"></div><div class="lbl">s-11<br/>64</div></div>
  <div class="step"><div class="box" style="width:80px;height:24px"></div><div class="lbl">s-12<br/>80</div></div>
</div>
</body></html>
