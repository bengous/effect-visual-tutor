<!doctype html>
<html lang="fr"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin:0; padding:18px; background:var(--paper); font-family:var(--font-ui); display:flex; flex-direction:column; gap:14px; }
  .nav { display:flex; align-items:center; justify-content:space-between; background:var(--surface-1); border:1px solid var(--rule); border-radius:var(--r-pill); padding:6px 8px; box-shadow:var(--shadow-1); }
  .left, .right { display:flex; align-items:center; gap:8px; }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:var(--r-pill); border:1px solid var(--rule); background:var(--paper); font-family:var(--font-ui); font-size:12px; color:var(--ink); cursor:pointer; }
  .btn.primary { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .step { font-family:var(--font-mono); font-size:12px; color:var(--ink-2); }
  .step .num { color:var(--ink); font-weight:600; }
  .dots { display:flex; gap:4px; }
  .dot { width:14px; height:4px; border-radius:2px; background:var(--surface-3); }
  .dot.done { background:var(--ink-3); }
  .dot.active { background:var(--ink); }
  .arrow { font-family:var(--font-mono); }
</style></head>
<body>
<div class="nav">
  <div class="left">
    <button class="btn"><span class="arrow">←</span>Précédent</button>
    <div class="step"><span class="num">02</span> / 07 &nbsp;·&nbsp; Charger les services</div>
  </div>
  <div class="dots">
    <span class="dot done"></span><span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>
  <div class="right">
    <button class="btn primary">Étape suivante<span class="arrow">→</span></button>
  </div>
</div>
</body></html>
