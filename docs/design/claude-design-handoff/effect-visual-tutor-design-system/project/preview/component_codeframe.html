<!doctype html>
<html lang="fr"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin:0; padding:20px; background:var(--paper); font-family:var(--font-ui); }
  .frame { background:var(--code-bg); border:1px solid var(--rule); border-radius:var(--r-4); overflow:hidden; box-shadow:var(--shadow-1); }
  .head { display:flex; align-items:center; justify-content:space-between; padding:8px 14px; border-bottom:1px solid var(--rule); background:var(--surface-2); }
  .head .file { font-family:var(--font-mono); font-size:12px; color:var(--ink-2); }
  .head .lang { font-family:var(--font-ui); font-size:11px; color:var(--ink-3); letter-spacing:.06em; text-transform:uppercase; }
  pre { margin:0; padding:12px 14px; font-family:var(--font-mono); font-size:13px; line-height:1.65; }
  .ln { display:inline-block; width:24px; color:var(--code-line-num); user-select:none; text-align:right; padding-right:12px; }
  .ln.active { color:var(--code-line-num-active); }
  .kw { color:var(--code-keyword); }
  .ty { color:var(--code-type); }
  .fn { color:var(--code-fn); }
  .yi { color:var(--code-yield); font-weight:700; }
  .pn { color:var(--code-punct); }
  .nm { color:var(--code-number); }
  .row.sel { background: var(--selected-bg); display:block; margin:0 -14px; padding:0 11px; border-left: 3px solid var(--selected-line); }
  .foot { padding:6px 14px; border-top:1px solid var(--rule); font-family:var(--font-mono); font-size:11px; color:var(--ink-3); display:flex; justify-content:space-between; }
</style></head>
<body>
<div class="frame">
  <div class="head"><span class="file">prepareRecapRun.ts</span><span class="lang">TypeScript</span></div>
<pre><span class="ln">12</span>  <span class="kw">return</span> Effect.<span class="fn">gen</span>(<span class="kw">function</span>* () <span class="pn">{</span>
<span class="row sel"><span class="ln active">13</span>    <span class="kw">const</span> services = <span class="yi">yield*</span> <span class="fn">loadRecapServices</span>();</span>
<span class="ln">14</span>    <span class="kw">const</span> state    = <span class="yi">yield*</span> services.stateManager.<span class="fn">load</span>();
<span class="ln">15</span>    <span class="pn">}</span>);</pre>
  <div class="foot"><span>Étape 02 / 07</span><span>4 lignes · 1 sélectionnée</span></div>
</div>
</body></html>
