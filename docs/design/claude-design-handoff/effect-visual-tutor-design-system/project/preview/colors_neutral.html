<!doctype html>
<html lang="fr"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin:0; padding:20px; background: var(--paper); }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .swatch { width:120px; }
  .chip { width:120px; height:64px; border-radius: var(--r-3); border:1px solid var(--rule); }
  .label { display:flex; justify-content:space-between; margin-top:6px; font-family:var(--font-mono); font-size:11px; color:var(--ink-2); }
  .name { color:var(--ink); font-weight:500; }
</style></head>
<body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:var(--paper)"></div><div class="label"><span class="name">paper</span><span>FAF8F4</span></div></div>
  <div class="swatch"><div class="chip" style="background:var(--surface-1)"></div><div class="label"><span class="name">surface-1</span><span>FFFFFF</span></div></div>
  <div class="swatch"><div class="chip" style="background:var(--surface-2)"></div><div class="label"><span class="name">surface-2</span><span>F1EEE7</span></div></div>
  <div class="swatch"><div class="chip" style="background:var(--surface-3)"></div><div class="label"><span class="name">surface-3</span><span>E6E1D7</span></div></div>
  <div class="swatch"><div class="chip" style="background:var(--rule)"></div><div class="label"><span class="name">rule</span><span>D9D3C5</span></div></div>
  <div class="swatch"><div class="chip" style="background:var(--ink-4)"></div><div class="label"><span class="name">ink-4</span><span>B0A998</span></div></div>
  <div class="swatch"><div class="chip" style="background:var(--ink-3)"></div><div class="label"><span class="name">ink-3</span><span>807969</span></div></div>
  <div class="swatch"><div class="chip" style="background:var(--ink-2)"></div><div class="label"><span class="name" style="color:var(--paper)">ink-2</span><span style="color:var(--ink-4)">4A463E</span></div></div>
  <div class="swatch"><div class="chip" style="background:var(--ink)"></div><div class="label"><span class="name" style="color:var(--paper)">ink</span><span style="color:var(--ink-4)">1A1814</span></div></div>
</div>
</body></html>
